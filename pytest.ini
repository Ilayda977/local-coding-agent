[pytest]
# Agent'ın kendi testleri tests/ altında. lca paketi kökten import edilir.
pythonpath = .
testpaths = tests
# taskflow/ kendi pytest.ini'si ile çalışır: python -m pytest taskflow
norecursedirs = legacy venv .git __pycache__ taskflow eval
# anyio eklentisi (ollama bağımlılığı) pytest 9'da gereksiz bir uyarı basıyor.
addopts = -p no:anyio
